<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>

    <!-- Vibrant Indigo-Violet-Cyan Accent -->
    <linearGradient id="accent" x1="200" y1="120" x2="1000" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(260 110) rotate(20) scale(340 200)">
      <stop stop-color="#6366F1" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(940 250) rotate(-160) scale(340 200)">
      <stop stop-color="#06B6D4" stop-opacity=".18"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Grid Background -->
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/>
    </pattern>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono { font-family: "JetBrains Mono", "Cascadia Code", "Fira Code", Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }

      /* Scanning line */
      .scan { animation: scan 7s linear infinite; }
      @keyframes scan {
        0% { transform: translateY(-40px); opacity: 0; }
        12% { opacity: .35; }
        88% { opacity: .35; }
        100% { transform: translateY(430px); opacity: 0; }
      }

      /* Glowing pulses */
      .pulse1 { animation: pulse1 4s ease-in-out infinite; }
      .pulse2 { animation: pulse2 5s ease-in-out infinite 1s; }
      .pulse3 { animation: pulse3 6s ease-in-out infinite 2s; }
      @keyframes pulse1 { 0%,100%{opacity:.3} 50%{opacity:.9} }
      @keyframes pulse2 { 0%,100%{opacity:.2} 50%{opacity:.8} }
      @keyframes pulse3 { 0%,100%{opacity:.25} 50%{opacity:.85} }

      /* Floating cards */
      .floatA { animation: floatA 8s ease-in-out infinite; transform-origin:center; }
      .floatB { animation: floatB 9s ease-in-out infinite 1s; transform-origin:center; }
      @keyframes floatA { 0%,100%{transform:translate(0,0)} 50%{transform:translate(6px,-6px)} }
      @keyframes floatB { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-6px,6px)} }

      /* Blinking terminal cursor */
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

      /* Dashed circuit animation */
      .dash {
        stroke-dasharray: 8 10;
        animation: dash 14s linear infinite;
      }
      @keyframes dash { to { stroke-dashoffset: -180; } }

      @media (prefers-reduced-motion: reduce) {
        .scan, .pulse1, .pulse2, .pulse3, .floatA, .floatB, .cursor, .dash { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glowLeft)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glowRight)"/>

  <!-- Animated Scanner -->
  <g class="scan">
    <rect x="0" y="-10" width="1200" height="1.5" fill="#6366F1" fill-opacity=".15"/>
    <rect x="0" y="-6" width="1200" height="10" fill="#6366F1" fill-opacity=".02"/>
  </g>

  <!-- Sleek Outer Border -->
  <rect x="1" y="1" width="1198" height="358" rx="23" stroke="url(#accent)" stroke-opacity=".3" stroke-width="1.8"/>

  <!-- Circuit traces -->
  <g opacity=".45">
    <path class="dash" d="M70 86 H195 L235 126 H330" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="70" cy="86" r="3.5" fill="#6366F1" class="pulse1"/>
    <circle cx="330" cy="126" r="3.5" fill="#8B5CF6" class="pulse2"/>

    <path class="dash" d="M870 240 H965 L1005 200 H1130" stroke="#06B6D4" stroke-width="1.5"/>
    <circle cx="870" cy="240" r="3.5" fill="#8B5CF6" class="pulse2"/>
    <circle cx="1130" cy="200" r="3.5" fill="#06B6D4" class="pulse3"/>
  </g>

  <!-- Left Floating Terminal Card -->
  <g class="floatA">
    <rect x="75" y="222" width="230" height="84" rx="12" fill="#161B22" fill-opacity=".82" stroke="#30363D"/>
    <!-- Mac dots -->
    <circle cx="98" cy="244" r="4" fill="#FF5F56"/>
    <circle cx="114" cy="244" r="4" fill="#FFBD2E"/>
    <circle cx="130" cy="244" r="4" fill="#27C93F"/>
    <text x="98" y="271" class="mono" font-size="11.5" fill="#8B949E">&gt; dev --env=production</text>
    <text x="98" y="291" class="mono" font-size="11.5" fill="#818CF8">✓ fast-api  ✓ react  ✓ llm</text>
  </g>

  <!-- Right Floating Stack Card -->
  <g class="floatB">
    <rect x="895" y="52" width="230" height="92" rx="12" fill="#161B22" fill-opacity=".82" stroke="#30363D"/>
    <text x="920" y="80" class="mono" font-size="11" font-weight="600" letter-spacing="1.5" fill="#8B949E">CURRENT FOCUS</text>
    <text x="920" y="106" class="mono" font-size="12.5" fill="#F0F6FC">Python · FastAPI</text>
    <text x="920" y="127" class="mono" font-size="12.5" fill="#38BDF8">React · TypeScript · Ollama</text>
  </g>

  <!-- Center Hero Section -->
  <g>
    <!-- Tagline above name -->
    <text x="600" y="128" text-anchor="middle" class="sans" font-size="15" font-weight="600" letter-spacing="3.5" fill="#818CF8">
      FULL-STACK DEVELOPER
    </text>

    <!-- Main Name -->
    <text x="600" y="194" text-anchor="middle" class="sans" font-size="54" font-weight="800" letter-spacing="1.5" fill="#F8FAFC">
      EREN BATI
    </text>

    <!-- Glowing Accent Divider -->
    <rect x="360" y="214" width="480" height="3" rx="1.5" fill="url(#accent)" filter="url(#softGlow)" opacity=".85"/>

    <!-- Subtitle / Bio -->
    <text x="600" y="252" text-anchor="middle" class="mono" font-size="15" fill="#CBD5E1">
      Web Applications · Desktop Tools · AI-Powered Systems
    </text>

    <!-- Terminal typing tagline -->
    <text x="600" y="287" text-anchor="middle" class="mono" font-size="13" fill="#38BDF8">
      building modern software with passion
      <tspan class="cursor" fill="#818CF8">_</tspan>
    </text>
  </g>

  <!-- Bottom Chips / Tags -->
  <g>
    <rect x="375" y="315" width="138" height="26" rx="13" fill="#161B22" stroke="#30363D"/>
    <circle cx="395" cy="328" r="4" fill="#3FB950" class="pulse1"/>
    <text x="408" y="332" class="mono" font-size="10.5" fill="#CBD5E1">TRAKYA CTIS</text>

    <rect x="525" y="315" width="150" height="26" rx="13" fill="#161B22" stroke="#30363D"/>
    <circle cx="545" cy="328" r="4" fill="#818CF8" class="pulse2"/>
    <text x="558" y="332" class="mono" font-size="10.5" fill="#CBD5E1">FASTAPI &amp; REACT</text>

    <rect x="687" y="315" width="138" height="26" rx="13" fill="#161B22" stroke="#30363D"/>
    <circle cx="707" cy="328" r="4" fill="#38BDF8" class="pulse3"/>
    <text x="720" y="332" class="mono" font-size="10.5" fill="#CBD5E1">AGENTIC AI</text>
  </g>
</svg>