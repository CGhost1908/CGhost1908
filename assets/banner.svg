<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F19"/>
      <stop offset="0.5" stop-color="#141829"/>
      <stop offset="1" stop-color="#0B0F19"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="headerGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity=".03" stroke-width="1"/>
    </pattern>

    <!-- Center Indigo Glow -->
    <radialGradient id="centerGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(500 130) scale(460 170)">
      <stop stop-color="#6366F1" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <!-- Ghost Glow -->
    <radialGradient id="ghostGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1010 130) scale(190 150)">
      <stop stop-color="#818CF8" stop-opacity=".26"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Name Gradient -->
    <linearGradient id="nameGrad" x1="100" y1="70" x2="500" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.75" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>

    <!-- Ghost Body Gradient -->
    <linearGradient id="ghostBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
      .mono { font-family: "JetBrains Mono", "Cascadia Code", "Fira Code", Consolas, monospace; }

      /* Ghost Floating Animation */
      .ghost-float {
        animation: ghostFloat 4s ease-in-out infinite;
        transform-origin: 1010px 130px;
      }
      @keyframes ghostFloat {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(2deg); }
      }

      /* Twinkling Pluses and Sparkles */
      .twinkle1 { animation: twinkle 3s ease-in-out infinite; }
      .twinkle2 { animation: twinkle 4s ease-in-out infinite 1s; }
      .twinkle3 { animation: twinkle 5s ease-in-out infinite 2s; }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.85); }
        50% { opacity: 0.9; transform: scale(1.15); }
      }

      /* Animated Dashed Lines */
      .dash-flow {
        stroke-dasharray: 6 8;
        animation: dashFlow 20s linear infinite;
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -200; }
      }

      /* Blinking Cursor */
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

      @media (prefers-reduced-motion: reduce) {
        .ghost-float, .twinkle1, .twinkle2, .twinkle3, .dash-flow, .cursor { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="260" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="260" rx="20" fill="url(#headerGrid)"/>
  <rect width="1200" height="260" rx="20" fill="url(#centerGlow)"/>
  <rect width="1200" height="260" rx="20" fill="url(#ghostGlow)"/>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="258" rx="19" stroke="#6366F1" stroke-opacity=".28" stroke-width="1.5"/>

  <!-- ================= BACKGROUND DECORATIONS ================= -->
  <g stroke="#818CF8" stroke-width="1.8" stroke-linecap="round">
    <g class="twinkle1" transform-origin="70 45">
      <line x1="70" y1="39" x2="70" y2="51" />
      <line x1="64" y1="45" x2="76" y2="45" />
    </g>
    <g class="twinkle3" transform-origin="80 215">
      <line x1="80" y1="208" x2="80" y2="222" />
      <line x1="73" y1="215" x2="87" y2="215" />
    </g>
    <g class="twinkle2" transform-origin="500 35">
      <line x1="500" y1="28" x2="500" y2="42" />
      <line x1="493" y1="35" x2="507" y2="35" />
    </g>
    <g class="twinkle1" transform-origin="1140 55">
      <line x1="1140" y1="48" x2="1140" y2="62" stroke="#A5B4FC" />
      <line x1="1133" y1="55" x2="1147" y2="55" stroke="#A5B4FC" />
    </g>
    <g class="twinkle3" transform-origin="1135 215">
      <line x1="1135" y1="210" x2="1135" y2="220" stroke-width="1.4"/>
      <line x1="1130" y1="215" x2="1140" y2="215" stroke-width="1.4"/>
    </g>
  </g>

  <!-- Sparkles -->
  <g fill="#A5B4FC">
    <path class="twinkle1" d="M 870 50 Q 870 57 877 57 Q 870 57 870 64 Q 870 57 863 57 Q 870 57 870 50 Z" opacity=".8"/>
    <path class="twinkle2" d="M 520 220 Q 520 226 526 226 Q 520 226 520 232 Q 520 226 514 226 Q 520 226 520 220 Z" opacity=".7"/>
  </g>

  <!-- Circuit Lines and Dot Matrix -->
  <g opacity=".35">
    <path class="dash-flow" d="M 40 130 H 65 L 85 110 H 105" stroke="#6366F1" stroke-width="1.5" fill="none"/>
    <circle cx="40" cy="130" r="3" fill="#6366F1"/>

    <!-- Subtle Dot Matrix -->
    <g fill="#475569" opacity=".5">
      <circle cx="850" cy="180" r="1.5"/><circle cx="862" cy="180" r="1.5"/><circle cx="874" cy="180" r="1.5"/>
      <circle cx="850" cy="192" r="1.5"/><circle cx="862" cy="192" r="1.5"/><circle cx="874" cy="192" r="1.5"/>
    </g>
  </g>

  <!-- ================= LEFT COLUMN: CLEAN TYPOGRAPHY ================= -->
  <g transform="translate(90, 0)">
    <!-- Main Name -->
    <text x="0" y="110" class="sans" font-size="56" font-weight="800" letter-spacing="1" fill="url(#nameGrad)">
      Eren Batı
    </text>

    <!-- Handle with elegant dash -->
    <text x="0" y="156" class="mono" font-size="19" font-weight="500" letter-spacing="2" fill="#818CF8">
      — CGhost1908 —
    </text>

    <!-- Bio Line -->
    <text x="0" y="194" class="mono" font-size="14" fill="#94A3B8">
      Full-Stack Developer · Trakya University CTIS
    </text>
  </g>

  <!-- ================= MIDDLE COLUMN: COMPACT SLEEK TERMINAL SNIPPET ================= -->
  <g transform="translate(530, 68)">
    <!-- Floating Terminal Box -->
    <rect width="330" height="124" rx="10" fill="#0D1117" fill-opacity=".95" stroke="#30363D" stroke-width="1.2"/>
    
    <!-- Mac Window Controls -->
    <circle cx="16" cy="16" r="3.5" fill="#FF5F56"/>
    <circle cx="28" cy="16" r="3.5" fill="#FFBD2E"/>
    <circle cx="40" cy="16" r="3.5" fill="#27C93F"/>
    <text x="56" y="19" class="mono" font-size="9.5" fill="#484F58">cghost ~ dev</text>

    <!-- Code Line 1 -->
    <text x="16" y="45" class="mono" font-size="11" fill="#8B949E">&gt; const <tspan fill="#79C0FF">stack</tspan> = [</text>
    <text x="32" y="65" class="mono" font-size="11" fill="#A5D6FF">"fastapi"<tspan fill="#8B949E">, </tspan>"react"<tspan fill="#8B949E">, </tspan>"ollama"</text>
    <text x="16" y="85" class="mono" font-size="11" fill="#8B949E">];</text>

    <!-- Status Line with Blinking Cursor -->
    <text x="16" y="107" class="mono" font-size="10.5" fill="#56D364">✓ ready <tspan class="cursor" fill="#58A6FF">_</tspan></text>
  </g>

  <!-- ================= RIGHT COLUMN: CUTE FLOATING GHOST ================= -->
  <g class="ghost-float">
    <!-- Ghost Drop Shadow -->
    <ellipse cx="1010" cy="215" rx="46" ry="8.5" fill="#000000" opacity=".35"/>

    <!-- Ghost Body -->
    <g transform="translate(945, 55)">
      <!-- Body Path with Ruffled Waves at bottom -->
      <path d="M 65 0 
               C 26 0, 0 30, 0 74
               C 0 110, 6 132, 6 140
               C 10 144, 20 144, 24 136
               C 28 128, 38 128, 42 136
               C 46 144, 56 144, 60 136
               C 64 128, 74 128, 78 136
               C 82 144, 92 144, 96 136
               C 100 128, 110 128, 114 136
               C 118 144, 126 144, 130 138
               C 132 132, 132 110, 132 74
               C 132 30, 104 0, 65 0 Z" 
            fill="url(#ghostBody)"/>

      <!-- Cute Blushing Cheeks -->
      <ellipse cx="36" cy="80" rx="9" ry="5" fill="#F472B6" opacity=".55"/>
      <ellipse cx="94" cy="80" rx="9" ry="5" fill="#F472B6" opacity=".55"/>

      <!-- Big Kawaii Eyes -->
      <ellipse cx="44" cy="68" rx="7" ry="9" fill="#0F172A"/>
      <circle cx="42" cy="65" r="2.8" fill="#FFFFFF"/>
      <circle cx="46" cy="71" r="1.4" fill="#FFFFFF"/>

      <ellipse cx="86" cy="68" rx="7" ry="9" fill="#0F172A"/>
      <circle cx="84" cy="65" r="2.8" fill="#FFFFFF"/>
      <circle cx="88" cy="71" r="1.4" fill="#FFFFFF"/>

      <!-- Happy Smile -->
      <path d="M 58 79 Q 65 87 72 79" stroke="#0F172A" stroke-width="2.6" stroke-linecap="round" fill="none"/>

      <!-- Floating Arms -->
      <path d="M 4 78 C -10 74, -14 60, -4 56 C 4 52, 12 66, 6 76" fill="#EEF2FF"/>
      <path d="M 128 78 C 138 80, 142 90, 134 94 C 126 98, 122 86, 126 78" fill="#E0E7FF"/>

      <!-- Sparkle on Ghost Head -->
      <path class="twinkle1" d="M 22 12 Q 22 18 28 18 Q 22 18 22 24 Q 22 18 16 18 Q 22 18 22 12 Z" fill="#FDE047"/>
    </g>
  </g>
</svg>