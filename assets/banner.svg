<svg width="1200" height="250" viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F19"/>
      <stop offset="0.5" stop-color="#141829"/>
      <stop offset="1" stop-color="#0B0F19"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="headerGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity=".03" stroke-width="1"/>
    </pattern>

    <!-- Center Indigo Glow -->
    <radialGradient id="centerGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(540 125) scale(460 160)">
      <stop stop-color="#6366F1" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <!-- Ghost Glow -->
    <radialGradient id="ghostGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(980 125) scale(200 150)">
      <stop stop-color="#818CF8" stop-opacity=".26"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Name Gradient -->
    <linearGradient id="nameGrad" x1="200" y1="70" x2="600" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.75" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>

    <!-- Ghost Body Gradient -->
    <linearGradient id="ghostBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
      .mono { font-family: "JetBrains Mono", "Cascadia Code", "Fira Code", Consolas, monospace; }

      /* Ghost Floating Animation */
      .ghost-float {
        animation: ghostFloat 4s ease-in-out infinite;
        transform-origin: 980px 125px;
      }
      @keyframes ghostFloat {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(2deg); }
      }

      /* Twinkling Pluses & Sparkles */
      .twinkle1 { animation: twinkle 3s ease-in-out infinite; }
      .twinkle2 { animation: twinkle 4s ease-in-out infinite 1s; }
      .twinkle3 { animation: twinkle 5s ease-in-out infinite 2s; }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.85); }
        50% { opacity: 0.9; transform: scale(1.15); }
      }

      /* Animated Dashed Lines */
      .dash-flow {
        stroke-dasharray: 6 8;
        animation: dashFlow 20s linear infinite;
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -200; }
      }

      @media (prefers-reduced-motion: reduce) {
        .ghost-float, .twinkle1, .twinkle2, .twinkle3, .dash-flow { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="250" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="250" rx="20" fill="url(#headerGrid)"/>
  <rect width="1200" height="250" rx="20" fill="url(#centerGlow)"/>
  <rect width="1200" height="250" rx="20" fill="url(#ghostGlow)"/>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="248" rx="19" stroke="#6366F1" stroke-opacity=".28" stroke-width="1.5"/>

  <!-- ================= BACKGROUND PLUSES, SPARKLES & CIRCUIT LINES ================= -->
  
  <g stroke="#818CF8" stroke-width="1.8" stroke-linecap="round">
    <g class="twinkle1" transform-origin="80 45">
      <line x1="80" y1="39" x2="80" y2="51" />
      <line x1="74" y1="45" x2="86" y2="45" />
    </g>
    <g class="twinkle2" transform-origin="340 30">
      <line x1="340" y1="26" x2="340" y2="34" />
      <line x1="336" y1="30" x2="344" y2="30" stroke-width="1.4"/>
    </g>
    <g class="twinkle3" transform-origin="110 205">
      <line x1="110" y1="198" x2="110" y2="212" />
      <line x1="103" y1="205" x2="117" y2="205" />
    </g>
    <g class="twinkle2" transform-origin="680 40">
      <line x1="680" y1="33" x2="680" y2="47" />
      <line x1="673" y1="40" x2="687" y2="40" />
    </g>
    <g class="twinkle1" transform-origin="730 210">
      <line x1="730" y1="204" x2="730" y2="216" />
      <line x1="724" y1="210" x2="736" y2="210" />
    </g>
    <g class="twinkle3" transform-origin="1120 60">
      <line x1="1120" y1="53" x2="1120" y2="67" stroke="#A5B4FC" />
      <line x1="1113" y1="60" x2="1127" y2="60" stroke="#A5B4FC" />
    </g>
    <g class="twinkle1" transform-origin="1135 195">
      <line x1="1135" y1="190" x2="1135" y2="200" stroke-width="1.4"/>
      <line x1="1130" y1="195" x2="1140" y2="195" stroke-width="1.4"/>
    </g>
  </g>

  <!-- Sparkle Stars (✦) -->
  <g fill="#A5B4FC">
    <path class="twinkle2" d="M 640 170 Q 640 176 646 176 Q 640 176 640 182 Q 640 176 634 176 Q 640 176 640 170 Z" opacity=".7"/>
    <path class="twinkle1" d="M 850 55 Q 850 62 857 62 Q 850 62 850 69 Q 850 62 843 62 Q 850 62 850 55 Z" opacity=".8"/>
    <path class="twinkle3" d="M 50 145 Q 50 150 55 150 Q 50 150 50 155 Q 50 150 45 150 Q 50 150 50 145 Z" opacity=".5"/>
  </g>

  <!-- Circuit Lines & Dot Matrix -->
  <g opacity=".35">
    <path class="dash-flow" d="M 40 110 H 75 L 100 135 H 125" stroke="#6366F1" stroke-width="1.5" fill="none"/>
    <circle cx="40" cy="110" r="3" fill="#6366F1"/>

    <path class="dash-flow" d="M 670 120 H 730 L 760 90 H 800" stroke="#818CF8" stroke-width="1.5" fill="none"/>
    <circle cx="670" cy="120" r="3" fill="#818CF8"/>
    <circle cx="800" cy="90" r="3" fill="#C7D2FE"/>

    <!-- Dot Matrix -->
    <g fill="#475569" opacity=".5">
      <circle cx="780" cy="160" r="1.5"/><circle cx="792" cy="160" r="1.5"/><circle cx="804" cy="160" r="1.5"/>
      <circle cx="780" cy="172" r="1.5"/><circle cx="792" cy="172" r="1.5"/><circle cx="804" cy="172" r="1.5"/>
      <circle cx="780" cy="184" r="1.5"/><circle cx="792" cy="184" r="1.5"/><circle cx="804" cy="184" r="1.5"/>
    </g>
  </g>

  <!-- ================= TEXT HERO CONTENT (CLEAN & CENTERED VERTICALLY) ================= -->
  <g transform="translate(100, 0)">
    <!-- Main Name -->
    <text x="0" y="105" class="sans" font-size="58" font-weight="800" letter-spacing="1" fill="url(#nameGrad)">
      Eren Batı
    </text>

    <!-- Handle / Subtitle with elegant dash -->
    <text x="0" y="152" class="mono" font-size="20" font-weight="500" letter-spacing="2" fill="#818CF8">
      — CGhost1908 —
    </text>

    <!-- Bio Line -->
    <text x="0" y="190" class="mono" font-size="14.5" fill="#94A3B8">
      Full-Stack Developer · Trakya University CTIS
    </text>
  </g>

  <!-- ================= CUTE FLOATING GHOST CHARACTER ================= -->
  <g class="ghost-float">
    <!-- Ghost Drop Shadow -->
    <ellipse cx="980" cy="210" rx="48" ry="9" fill="#000000" opacity=".35"/>

    <!-- Ghost Body -->
    <g transform="translate(915, 50)">
      <!-- Body Path with Ruffled Waves at bottom -->
      <path d="M 65 0 
               C 26 0, 0 30, 0 74
               C 0 110, 6 132, 6 140
               C 10 144, 20 144, 24 136
               C 28 128, 38 128, 42 136
               C 46 144, 56 144, 60 136
               C 64 128, 74 128, 78 136
               C 82 144, 92 144, 96 136
               C 100 128, 110 128, 114 136
               C 118 144, 126 144, 130 138
               C 132 132, 132 110, 132 74
               C 132 30, 104 0, 65 0 Z" 
            fill="url(#ghostBody)"/>

      <!-- Cute Blushing Cheeks -->
      <ellipse cx="36" cy="80" rx="9" ry="5" fill="#F472B6" opacity=".55"/>
      <ellipse cx="94" cy="80" rx="9" ry="5" fill="#F472B6" opacity=".55"/>

      <!-- Big Kawaii Eyes -->
      <ellipse cx="44" cy="68" rx="7" ry="9" fill="#0F172A"/>
      <circle cx="42" cy="65" r="2.8" fill="#FFFFFF"/>
      <circle cx="46" cy="71" r="1.4" fill="#FFFFFF"/>

      <ellipse cx="86" cy="68" rx="7" ry="9" fill="#0F172A"/>
      <circle cx="84" cy="65" r="2.8" fill="#FFFFFF"/>
      <circle cx="88" cy="71" r="1.4" fill="#FFFFFF"/>

      <!-- Happy Smile -->
      <path d="M 58 79 Q 65 87 72 79" stroke="#0F172A" stroke-width="2.6" stroke-linecap="round" fill="none"/>

      <!-- Floating Arms -->
      <path d="M 4 78 C -10 74, -14 60, -4 56 C 4 52, 12 66, 6 76" fill="#EEF2FF"/>
      <path d="M 128 78 C 138 80, 142 90, 134 94 C 126 98, 122 86, 126 78" fill="#E0E7FF"/>

      <!-- Sparkle on Ghost Head -->
      <path class="twinkle1" d="M 22 12 Q 22 18 28 18 Q 22 18 22 24 Q 22 18 16 18 Q 22 18 22 12 Z" fill="#FDE047"/>
    </g>
  </g>
</svg>