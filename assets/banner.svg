<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F19"/>
      <stop offset="0.5" stop-color="#141829"/>
      <stop offset="1" stop-color="#0B0F19"/>
    </linearGradient>

    <!-- Subtle Grid -->
    <pattern id="headerGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-opacity=".03" stroke-width="1"/>
    </pattern>

    <!-- Center Indigo Glow -->
    <radialGradient id="centerGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(540 150) scale(460 180)">
      <stop stop-color="#6366F1" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <!-- Ghost Glow -->
    <radialGradient id="ghostGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(980 150) scale(200 160)">
      <stop stop-color="#818CF8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Name Gradient -->
    <linearGradient id="nameGrad" x1="200" y1="80" x2="600" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.75" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>

    <!-- Ghost Body Gradient -->
    <linearGradient id="ghostBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
      .mono { font-family: "JetBrains Mono", "Cascadia Code", "Fira Code", Consolas, monospace; }

      /* Ghost Floating and Swaying Animation */
      .ghost-float {
        animation: ghostFloat 4s ease-in-out infinite;
        transform-origin: 980px 150px;
      }
      @keyframes ghostFloat {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2.5deg); }
      }

      /* Blinking Twinkles / Crosses */
      .twinkle1 { animation: twinkle 3s ease-in-out infinite; }
      .twinkle2 { animation: twinkle 4s ease-in-out infinite 1s; }
      .twinkle3 { animation: twinkle 5s ease-in-out infinite 2s; }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.85); }
        50% { opacity: 0.9; transform: scale(1.15); }
      }

      /* Animated Dashed Lines */
      .dash-flow {
        stroke-dasharray: 6 8;
        animation: dashFlow 20s linear infinite;
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -200; }
      }

      /* Blinking Cursor */
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

      /* Pulsing Dot */
      .pulse-dot { animation: pulseDot 2s ease-in-out infinite; }
      @keyframes pulseDot { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.4; transform:scale(.8);} }

      @media (prefers-reduced-motion: reduce) {
        .ghost-float, .twinkle1, .twinkle2, .twinkle3, .dash-flow, .cursor, .pulse-dot { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" rx="20" fill="url(#headerGrid)"/>
  <rect width="1200" height="300" rx="20" fill="url(#centerGlow)"/>
  <rect width="1200" height="300" rx="20" fill="url(#ghostGlow)"/>

  <!-- Outer Sleek Border -->
  <rect x="1" y="1" width="1198" height="298" rx="19" stroke="#6366F1" stroke-opacity=".3" stroke-width="1.5"/>

  <!-- ================= BACKGROUND DECORATIONS (PLUSES, SPARKLES, CIRCUIT LINES) ================= -->
  
  <!-- Plus Crosses (+) Scattered -->
  <g stroke="#818CF8" stroke-width="1.8" stroke-linecap="round">
    <g class="twinkle1" transform-origin="80 50">
      <line x1="80" y1="44" x2="80" y2="56" />
      <line x1="74" y1="50" x2="86" y2="50" />
    </g>
    <g class="twinkle2" transform-origin="340 35">
      <line x1="340" y1="31" x2="340" y2="39" />
      <line x1="336" y1="35" x2="344" y2="35" stroke-width="1.4"/>
    </g>
    <g class="twinkle3" transform-origin="120 250">
      <line x1="120" y1="243" x2="120" y2="257" />
      <line x1="113" y1="250" x2="127" y2="250" />
    </g>
    <g class="twinkle2" transform-origin="680 45">
      <line x1="680" y1="38" x2="680" y2="52" />
      <line x1="673" y1="45" x2="687" y2="45" />
    </g>
    <g class="twinkle1" transform-origin="720 260">
      <line x1="720" y1="254" x2="720" y2="266" />
      <line x1="714" y1="260" x2="726" y2="260" />
    </g>
    <g class="twinkle3" transform-origin="1120 70">
      <line x1="1120" y1="63" x2="1120" y2="77" stroke="#A5B4FC" />
      <line x1="1113" y1="70" x2="1127" y2="70" stroke="#A5B4FC" />
    </g>
    <g class="twinkle1" transform-origin="1140 230">
      <line x1="1140" y1="225" x2="1140" y2="235" stroke-width="1.4"/>
      <line x1="1135" y1="230" x2="1145" y2="230" stroke-width="1.4"/>
    </g>
  </g>

  <!-- Sparkle Stars (✦) -->
  <g fill="#A5B4FC">
    <path class="twinkle2" d="M 620 200 Q 620 206 626 206 Q 620 206 620 212 Q 620 206 614 206 Q 620 206 620 200 Z" opacity=".7"/>
    <path class="twinkle1" d="M 860 65 Q 860 72 867 72 Q 860 72 860 79 Q 860 72 853 72 Q 860 72 860 65 Z" opacity=".8"/>
    <path class="twinkle3" d="M 60 170 Q 60 175 65 175 Q 60 175 60 180 Q 60 175 55 175 Q 60 175 60 170 Z" opacity=".5"/>
  </g>

  <!-- Technical Circuit Lines and Dot Matrix -->
  <g opacity=".35">
    <path class="dash-flow" d="M 50 120 H 90 L 115 145 H 140" stroke="#6366F1" stroke-width="1.5" fill="none"/>
    <circle cx="50" cy="120" r="3" fill="#6366F1"/>

    <path class="dash-flow" d="M 680 130 H 740 L 770 100 H 810" stroke="#818CF8" stroke-width="1.5" fill="none"/>
    <circle cx="680" cy="130" r="3" fill="#818CF8"/>
    <circle cx="810" cy="100" r="3" fill="#C7D2FE"/>

    <!-- Subtle Dot Matrix Clusters -->
    <g fill="#475569" opacity=".5">
      <circle cx="780" cy="180" r="1.5"/><circle cx="792" cy="180" r="1.5"/><circle cx="804" cy="180" r="1.5"/>
      <circle cx="780" cy="192" r="1.5"/><circle cx="792" cy="192" r="1.5"/><circle cx="804" cy="192" r="1.5"/>
      <circle cx="780" cy="204" r="1.5"/><circle cx="792" cy="204" r="1.5"/><circle cx="804" cy="204" r="1.5"/>
    </g>
  </g>

  <!-- ================= TEXT HERO CONTENT (LEFT SIDE) ================= -->
  <g transform="translate(90, 0)">
    
    <!-- Status Pill: "READY TO CODE" with glowing green indicator -->
    <g transform="translate(0, 46)">
      <rect width="180" height="26" rx="13" fill="#161B22" stroke="#30363D" stroke-width="1"/>
      <circle cx="16" cy="13" r="4" fill="#10B981" class="pulse-dot" transform-origin="16 13"/>
      <text x="28" y="17" class="mono" font-size="11" font-weight="600" letter-spacing="1.2" fill="#E2E8F0">READY TO CODE</text>
      <text x="138" y="17" class="mono" font-size="10" fill="#64748B">● v2.0</text>
    </g>

    <!-- Main Name -->
    <text x="0" y="118" class="sans" font-size="52" font-weight="800" letter-spacing="1" fill="url(#nameGrad)">
      Eren Batı
    </text>

    <!-- Handle and Subtitle -->
    <text x="0" y="156" class="mono" font-size="17" font-weight="500" letter-spacing="1.5" fill="#818CF8">
      — CGhost1908 —
    </text>

    <!-- Mini IDE Terminal Snippet (Code Block) -->
    <g transform="translate(0, 178)">
      <!-- Terminal Window Box -->
      <rect width="470" height="88" rx="10" fill="#0D1117" fill-opacity=".92" stroke="#30363D" stroke-width="1.2"/>
      
      <!-- Window Controls -->
      <circle cx="18" cy="16" r="4" fill="#FF5F56"/>
      <circle cx="32" cy="16" r="4" fill="#FFBD2E"/>
      <circle cx="46" cy="16" r="4" fill="#27C93F"/>
      <text x="64" y="19" class="mono" font-size="10" fill="#484F58">cghost@workspace: ~</text>

      <!-- Code Line 1 -->
      <text x="18" y="44" class="mono" font-size="12" fill="#8B949E">&gt; const <tspan fill="#79C0FF">developer</tspan> = { <tspan fill="#FFA657">role</tspan>: <tspan fill="#A5D6FF">"Full-Stack"</tspan>, <tspan fill="#FFA657">coffee</tspan>: <tspan fill="#79C0FF">true</tspan> };</text>

      <!-- Code Line 2 -->
      <text x="18" y="64" class="mono" font-size="12" fill="#8B949E">&gt; await <tspan fill="#D2A8FF">deploy</tspan>(<tspan fill="#A5D6FF">"fastapi"</tspan>, <tspan fill="#A5D6FF">"react"</tspan>, <tspan fill="#A5D6FF">"ollama"</tspan>);</text>

      <!-- Code Line 3: Execution Output -->
      <text x="18" y="82" class="mono" font-size="11.5" fill="#56D364">✓ Systems operational <tspan class="cursor" fill="#58A6FF">_</tspan></text>
    </g>
  </g>

  <!-- ================= CUTE FLOATING GHOST CHARACTER ================= -->
  <g class="ghost-float">
    <!-- Ghost Soft Drop Shadow -->
    <ellipse cx="980" cy="245" rx="50" ry="10" fill="#000000" opacity=".4"/>

    <!-- Ghost Body -->
    <g transform="translate(915, 75)">
      <!-- Body Path with Ruffled Waves at bottom -->
      <path d="M 65 0 
               C 26 0, 0 30, 0 74
               C 0 110, 6 132, 6 140
               C 10 144, 20 144, 24 136
               C 28 128, 38 128, 42 136
               C 46 144, 56 144, 60 136
               C 64 128, 74 128, 78 136
               C 82 144, 92 144, 96 136
               C 100 128, 110 128, 114 136
               C 118 144, 126 144, 130 138
               C 132 132, 132 110, 132 74
               C 132 30, 104 0, 65 0 Z" 
            fill="url(#ghostBody)"/>

      <!-- Cute Blushing Cheeks -->
      <ellipse cx="36" cy="80" rx="9" ry="5" fill="#F472B6" opacity=".55"/>
      <ellipse cx="94" cy="80" rx="9" ry="5" fill="#F472B6" opacity=".55"/>

      <!-- Big Kawaii Eyes -->
      <ellipse cx="44" cy="68" rx="7" ry="9" fill="#0F172A"/>
      <circle cx="42" cy="65" r="2.8" fill="#FFFFFF"/>
      <circle cx="46" cy="71" r="1.4" fill="#FFFFFF"/>

      <ellipse cx="86" cy="68" rx="7" ry="9" fill="#0F172A"/>
      <circle cx="84" cy="65" r="2.8" fill="#FFFFFF"/>
      <circle cx="88" cy="71" r="1.4" fill="#FFFFFF"/>

      <!-- Happy Smile -->
      <path d="M 58 79 Q 65 87 72 79" stroke="#0F172A" stroke-width="2.6" stroke-linecap="round" fill="none"/>

      <!-- Floating Arms -->
      <!-- Left Hand Waving -->
      <path d="M 4 78 C -10 74, -14 60, -4 56 C 4 52, 12 66, 6 76" fill="#EEF2FF"/>
      <!-- Right Hand -->
      <path d="M 128 78 C 138 80, 142 90, 134 94 C 126 98, 122 86, 126 78" fill="#E0E7FF"/>

      <!-- Cute Sparkle on Ghost Head -->
      <path class="twinkle1" d="M 22 12 Q 22 18 28 18 Q 22 18 22 24 Q 22 18 16 18 Q 22 18 22 12 Z" fill="#FDE047"/>
    </g>
  </g>
</svg>