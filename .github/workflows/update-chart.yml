name: Update Contribution Chart

on:
  schedule:
    - cron: '0 0 * * *' # Her gece 00:00 UTC calisir
  workflow_dispatch: # Manuel tetikleme butonu

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and theme contribution chart
        run: |
          curl -s "https://ghchart.rshah.org/6366f1/CGhost1908" > assets/chart.svg
          sed -i 's/fill:#EEEEEE/fill:#161B22/g' assets/chart.svg
          sed -i 's/fill:#767676/fill:#8B949E/g' assets/chart.svg

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/chart.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update dark contribution chart" && git push)